syntax = "proto3";

package security;

option go_package = "github.com/stratifyr/security-service/internal/handlers/grpc";

service SecurityService {
  rpc GetMarketDays(GetMarketDaysRequest) returns (GetMarketDaysResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  rpc GetSecurities(GetSecuritiesRequest) returns (GetSecuritiesResponse);
  rpc UpdateSecurity(UpdateSecurityRequest) returns (UpdateSecurityResponse);
  rpc CreateOrUpdateSecurityStat(CreateOrUpdateSecurityStatRequest) returns (CreateOrUpdateSecurityStatResponse);
  rpc GetMarketDataJobs(GetMarketDataJobsRequest) returns (GetMarketDataJobsResponse);
  rpc UpdateMarketDataJob(UpdateMarketDataJobRequest) returns (UpdateMarketDataJobResponse);
}

message GetMarketDaysRequest {
  string start_date = 1;
  string end_date = 2;
}

message GetMarketDaysResponse {
  repeated string days = 1;
}

message GetMetricsRequest {}

message GetMetricsResponse {
  repeated Metric metrics = 1;
  int32 total = 2;
}

message GetSecuritiesRequest {
  string date = 5;
}

message GetSecuritiesResponse {
  repeated Security securities = 1;
  int32 total = 2;
}

message UpdateSecurityRequest {
  int32 id = 1;
  string symbol = 2;
  string industry = 3;
  string name = 4;
  string image = 5;
  double ltp = 6;
}

message UpdateSecurityResponse {
  Security security = 1;
}

message CreateOrUpdateSecurityStatRequest {
  int32 securityId = 1;
  string date = 2;
  double open = 3;
  double close = 4;
  double high = 5;
  double low = 6;
  int32 volume = 7;
}

message CreateOrUpdateSecurityStatResponse {
  SecurityStat securityStat = 1;
}

message GetMarketDataJobsRequest {
  string status = 1;
}

message GetMarketDataJobsResponse {
  repeated MarketDataJob marketDataJobs = 1;
  int32 total = 2;
}

message UpdateMarketDataJobRequest {
  int32 id = 1;
  string status = 2;
  bytes logs = 3;
}

message UpdateMarketDataJobResponse {
  MarketDataJob marketDataJob = 1;
}

message Security {
  int32 id = 1;
  string isin = 2;
  string symbol = 3;
  string industry = 4;
  string name = 5;
  string image = 6;
  double ltp = 7;
  double previous_close = 8;
  string created_at = 9;
  string updated_at = 10;
  MarketData market_data = 11;
}

message MarketData {
  string date = 1;
  double open = 2;
  double close = 3;
  double high = 4;
  double low = 5;
  int32 volume = 6;
  repeated SecurityMetric metrics = 7;
}

message SecurityMetric {
  int32 id = 1;
  string name = 2;
  string type = 3;
  int32 period = 4;
  string indicator = 5;
  double value = 6;
  double normalized_value = 7;
}

message Metric {
  int32 id = 1;
  string name = 2;
  string type = 3;
  int32 period = 4;
  string indicator = 5;
  string created_at = 6;
  string updated_at = 7;
}

message SecurityStat {
  int32 id = 1;
  int32 securityId = 2;
  string date = 3;
  double open = 4;
  double close = 5;
  double high = 6;
  double low = 7;
  int32 volume = 8;
  string created_at = 9;
  string updated_at = 10;
}

message MarketDataJob {
  int32 id = 1;
  string type = 2;
  string status = 3;
  bytes logs = 4;
  string created_at = 5;
  string updated_at = 6;
}